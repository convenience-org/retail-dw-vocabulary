vocab:
  id: rdw
  value: https://w3id.org/retail-dw#
prefix:
  - id: retail
    value: https://w3id.org/retail#
  - id: rm
    value: https://w3id.org/vc/render-method#
  - id: sdo
    value: https://schema.org/
  - id: sec
    value: https://w3id.org/security#
  - id: vc
    value: https://www.w3.org/2018/credentials#
ontology:
  - property: dc:title
    value: Retail Digital Wallet Vocabulary
  - property: dc:description
    value: |-
      <div>
        <p>
          This specification defines a vocabulary for modeling a wide range
          of retail credentials commonly stored in digital wallets. These
          credentials include coupons, gift cards, loyalty cards, membership
          cards, tokenized payment methods, rebates, and receipts. As digital
          wallets become increasingly central to consumer commerce and mobile
          transactions, there is a growing need for a standard, interoperable
          data model that supports retail use cases in a consistent and
          extensible manner.
        </p>

        <p>
          The vocabulary is designed to be used in conjunction with the <a
          href="https://www.w3.org/TR/vc-data-model/">W3C Verifiable Credentials
          Data Model</a>, which provides a secure, privacy-respecting framework
          for issuing and verifying digitally signed credentials. By aligning
          with the Verifiable Credentials ecosystem, the vocabulary allows
          retail data to be issued by trusted entities, cryptographically
          signed, selectively disclosed, and independently verified. This
          enables higher levels of trust, transparency, and security across
          digital wallet transactions, whether they are processed online or
          in-person.
        </p>

        <p>
          One of the primary benefits of using this vocabulary is the reduction
          of integration complexity across digital wallet implementations.
          Developers can avoid the need to support multiple proprietary schemas
          or ad hoc data formats, relying instead on a shared vocabulary with
          well-defined semantics. This promotes interoperability between wallet
          applications and merchant systems, facilitates innovation across the
          digital commerce landscape, and enables more consistent user
          experiences for consumers interacting with their retail credentials.
        </p>

        <p>
          In addition to supporting standardized credential structures, the
          vocabulary is designed with extensibility in mind. Developers can
          build upon core terms to accommodate emerging retail use cases,
          regional requirements, or custom business logic. The vocabulary also
          aligns with best practices for digital identity, data privacy, and
          cryptographic verification, allowing developers to create
          privacy-respecting and trustworthy wallet experiences. By adopting
          this vocabulary, implementers contribute to a more open,
          interoperable, and future-proof digital wallet ecosystem that
          leverages global web standards.
        </p>
      </div>
  - property: dc:abstract
    value: >-
      This specification defines a vocabulary for representing retail-related
      credentials commonly stored in digital wallets, including coupons, gift
      cards, loyalty cards, membership cards, tokenized payment methods,
      rebates, and receipts. The vocabulary provides a standardized,
      machine-readable framework for expressing the structure and semantics of
      these credential types, enabling consistent interoperability across wallet
      providers, merchants, and service platforms.
class:
  - id: retail:Amount
    label: Monetary amount
    context: https://w3id.org/retail-dw/v1rc2
  - id: Coupon
    label: Coupon
    comment: >-
      A voucher entitling the holder to a discount or that may be exchanged for
      goods or services.
    context: https://w3id.org/retail-dw/v1rc2
    example:
      - label: A basic example of the Coupon class expressed as JSON-LD.
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "id": "https://coupon.example/12345",
            "type": "Coupon",
            "barcodeData": "0123456789123",
            "description": "$1 off a regular coffee.",
            "discount": {
              "type": "Discount",
              "discountName": "$1 off a regular coffee.",
              "discountReason": "Celebrating 10 years in business!",
              "discountQuantity": {
                "type": "QuantityUN",
                "value": "1",
                "uom": "EA"
              },
              "discountAmount": {
                "type": "Amount",
                "value": "-1.00",
                "currency": "USD"
              }
            }
          }
      - label: A basic example of an 8112 Coupon
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "type": "Coupon",
            "barcodeData": "81126789123012345"
          }
  - id: CouponBundle
    label: Coupon Bundle
    comment: >-
      A collection of coupons that are offered together, often providing
      multiple discounts or offers. The bundle and a transaction identifier are
      sent to a bundle matching service which provides information on whether or
      not the bundle is applicable to the transaction.
    context: https://w3id.org/retail-dw/v1rc2
    example:
      - label: A basic example of the CouponBundle
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "type": "CouponBundle",
            "barcodeData": "0123456789010479832",
            "name": "ClipCo Coupons",
            "description": "Clip and Save Coupons",
            "bundleMatcher": "https://coupon.example/matcher"
          }
  - id: retail:Discount
    label: Discount
    context: https://w3id.org/retail-dw/v1rc2
  - id: GiftCard
    label: Gift Card
    comment: >-
      A prepaid card that can be used as an alternative to cash for purchases
      within a particular store or group of stores.
    example:
      - label: A basic example of a GiftCard
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "type": "GiftCard",
            "description": "ShopCo Gift Card",
            "barcodeData": "567789123456",
            "programIdentifier": "567", // Do we need this?
            "account": "789123456",
          }
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:ItemCode
    label: Product item code
    context: https://w3id.org/retail-dw/v1rc2
  - id: LoyaltyCard
    label: Loyalty Card
    comment: >-
      A card issued by a retailer to a customer that facilitates accumulation of
      loyalty points, rewards, or discounts.
    context: https://w3id.org/retail-dw/v1rc2
    example:
      - label: A basic example of a LoyaltyCard
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "type": "LoyaltyCard",
            "name": "ShopCo Points Card",
            "description": "Use when checking out for rewards at ShopCo.",
            "barcodeData": "123456789123",
            "programIdentifier": "123",
            "account": "456789123",
          }
  - id: MembershipCard
    label: Membership Card
    comment: >-
      A card that signifies membership in a retail program, granting access to
      member-exclusive discounts and rewards.
    example:
      - label: A basic example of a MembershipCard
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "type": "MembershipCard",
            "name": "QuickCo Membership Card",
            "description": "Use when checking out for discounts at QuickCo.",
            "barcodeData": "912345612789",
            "programIdentifier": "912",
            "account": "345612789"
          }
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:MonetaryAmount
    label: Monetary Amount
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:Observation
    label: Observation
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentConfirmation
    label: Payment Confirmation
    comment: >-
      A confirmation that funds have been captured, transferring the captured
      amount from the payer to the payee. It is issued by the payment gateway
      after a payment entitlement has been used to capture funds. Its
      transaction identifier corresponds to that of the payment entitlement
      and payment request it settles.
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentConfirmationCredential
    label: Payment Confirmation Credential
    comment: >-
      A credential that expresses a PaymentConfirmation. It is issued by a
      payment gateway to the payee as proof that a capture completed.
    example:
      - label: A basic example of a PaymentConfirmationCredential
        json: |-
          {
            "@context": [
              "https://www.w3.org/ns/credentials/v2",
              "https://w3id.org/retail-dw/v1rc2"
            ],
            "type": ["VerifiableCredential", "PaymentConfirmationCredential"],
            "issuer": "did:web:vcpg.example",
            "validFrom": "2026-05-26T12:40:00Z",
            "name": "Coffee Purchase Confirmation",
            "description": "Confirmation that funds were captured for a coffee purchase.",
            "credentialSubject": {
              "id": "did:web:merchant.example",
              "type": "PaymentConfirmation",
              "transactionID": "urn:uuid:fc2eff04-6540-4aef-a7db-bf212566088d",
              "capturedAmount": {
                "type": "Amount",
                "currency": "USD",
                "value": "47.50"
              },
              "paymentNetwork": "urn:payment-network:utopia-usd",
              "paymentGateway": "did:web:vcpg.example"
            }
          }
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentDestination
    label: Payment Destination
    comment: >-
      A destination that may receive payment in fulfillment of a payment
      request. The destination identifier is opaque; a payment gateway or
      payment processor is responsible for resolving it to an underlying
      account. The identifier is optional: when it is absent, the payment
      gateway or payment processor may derive a default account from the
      issuer's request and the payment network.
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentEntitlement
    label: Payment Entitlement
    comment: >-
      An entitlement to capture funds that have been reserved by a pre-auth. It
      is issued after a payment method and payment request have been verified,
      and is later presented to capture up to the authorized amount. The
      entitlement's transaction identifier and payment network correspond to
      those of the payment request it fulfills.
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentEntitlementCredential
    label: Payment Entitlement Credential
    comment: >-
      A credential that expresses a PaymentEntitlement. It is presented together
      with a PaymentRequestCredential at capture time so that a payment gateway
      can verify the capture against the reserved funds.
    example:
      - label: A basic example of a PaymentEntitlementCredential
        json: |-
          {
            "@context": [
              "https://www.w3.org/ns/credentials/v2",
              "https://w3id.org/retail-dw/v1rc2"
            ],
            "type": ["VerifiableCredential", "PaymentEntitlementCredential"],
            "issuer": "did:web:vcpg.example",
            "validFrom": "2026-05-26T12:30:00Z",
            "validUntil": "2026-05-26T12:45:00Z",
            "name": "Coffee Purchase Entitlement",
            "description": "Authorization to capture funds for a coffee purchase.",
            "credentialSubject": {
              "id": "did:web:merchant.example",
              "type": "PaymentEntitlement",
              "transactionID": "urn:uuid:fc2eff04-6540-4aef-a7db-bf212566088d",
              "authorizedAmount": {
                "type": "Amount",
                "currency": "USD",
                "value": "47.50"
              },
              "paymentNetwork": "urn:payment-network:utopia-usd",
              "confidenceMethod": "did:key:z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8x",
              "paymentGateway": "did:web:vcpg.example"
            }
          }
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentGateway
    label: Payment Gateway
    comment: >-
      A service that verifies and authenticates the presentation of a
      PaymentMethodCredential before passing the associated PaymentInstrument
      to payment processing software. A payment gateway and a payment method
      issuer must have an existing relationship in order to process a payment.
    example:
      - label: A payment gateway identified by a DID
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "id": "did:web:paymentgateway.example",
            "type": "PaymentGateway"
          }
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentInstrument
    label: Payment Instrument
    comment: >-
      An abstract identifier for a source of funds that can be used at a
      payment gateway to perform a payment. The instrument identifier is
      opaque; a payment gateway or payment processor is responsible for
      resolving it to an underlying account. Details of how money moves are
      deliberately excluded so that the instrument remains agnostic to any
      particular payment network.
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentMethodCredential
    label: Payment Method Credential
    comment: >-
      A credential that makes claims about a PaymentInstrument that can be used
      at a payment gateway to perform a payment. It is only accepted when
      presented in a verifiable presentation together with proof of control
      over the confidence method associated with the payment instrument, which
      prevents unauthorized payment.
    example:
      - label: A basic example of a PaymentMethodCredential
        json: |-
          {
            "@context": [
              "https://www.w3.org/ns/credentials/v2",
              "https://w3id.org/retail-dw/v1rc2"
            ],
            "type": ["VerifiableCredential", "PaymentMethodCredential"],
            "issuer": {
              "id": "https://payment-provider.example/",
              "name": "Example Payment Method Issuer"
            },
            "validFrom": "2025-03-01T00:00:00Z",
            "validUntil": "2026-03-01T00:00:00Z",
            "name": "Utopia Everyday",
            "description": "Utopia Payments everyday spending account.",
            "credentialSubject": {
              "id": "urn:uuid:6c1a4f92-3c2e-4b0a-9d55-0f6e2b1a77aa",
              "type": "PaymentInstrument",
              "paymentNetwork": "urn:payment-network:utopia-usd",
              "confidenceMethod": "did:key:z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8x",
              "paymentGateway": "did:web:paymentgateway.example"
            }
          }
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentRequest
    label: Payment Request
    comment: >-
      A request for payment, expressing the amount that may be collected
      and one or more destinations that may receive it. A destination's payment
      network must match the payment network of the payment instrument used to
      fulfill the request.
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentRequestCredential
    label: Payment Request Credential
    comment: >-
      A credential that expresses a PaymentRequest. It is presented alongside a
      PaymentMethodCredential so that a payment gateway can determine whether
      the payment instrument is compatible with the requested payment.
    example:
      - label: A basic example of a PaymentRequestCredential
        json: |-
          {
            "@context": [
              "https://www.w3.org/ns/credentials/v2",
              "https://w3id.org/retail-dw/v1rc2"
            ],
            "type": ["VerifiableCredential", "PaymentRequestCredential"],
            "issuer": "did:web:merchant.example",
            "validFrom": "2025-03-01T00:00:00Z",
            "validUntil": "2026-03-01T00:00:00Z",
            "name": "Coffee Purchase",
            "description": "Payment request for a coffee purchase.",
            "credentialSubject": {
              "id": "urn:uuid:9f2b7c14-8a1d-4e6b-b3aa-2c9e5d4f1b30",
              "type": "PaymentRequest",
              "transactionID": "order-7839",
              "maximumAmount": {
                "type": "Amount",
                "currency": "USD",
                "value": "1.00"
              },
              "paymentDestination": [{
                "type": "PaymentDestination",
                "paymentNetwork": "urn:payment-network:utopia-usd"
              }]
            }
          }
    context: https://w3id.org/retail-dw/v1rc2
  - id: PaymentToken
    label: Payment Token
    comment: >-
      A tokenized payment instrument that can be used through a payment network
      that knows how to communicate with the tokenization provider.
    example:
      - label: A basic example of a PaymentToken
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "type": "PaymentToken",
            "issuer": "https://tokenizer.example/",
            "token": "uFkNDk1OTI5OWM1ZmIyZGFmY2RkODY5NDllM2Q0YTI3ZT"
          }
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosCodeFormat
    label: Point of sale item code format
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosJournalAgeVerificationLine
    label: Point of sale age verification line entry
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosJournalDiscountLine
    label: Point of sale discount line entry
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosJournalFuelLine
    label: Point of sale fuel line entry
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosJournalFuelPrepayLine
    label: Point of sale fuel pre-pay line entry
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosJournalItemLine
    label: Point of sale journal item line entry
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosJournalLinkedTransactionInfo
    label: Point of sale linked transaction information
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosJournalLoyaltyLine
    label: Point of sale journal loyalty line entry
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosJournalMerchandiseCodeLine
    label: Point of sale journal merchandise code line entry
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:PosJournalTenderInfoLine
    label: Point of sale tender information line entry
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:PostalAddress
    label: Postal address
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:QuantityUN
    label: Quantity (UN/CEFACT unit codes)
    context: https://w3id.org/retail-dw/v1rc2
  - id: Rebate
    label: Rebate
    comment: >-
      A refund or return of part of the purchase price by the seller to the
      buyer, typically given as a promotional offer.
    context: https://w3id.org/retail-dw/v1rc2
  - id: Receipt
    label: Receipt
    comment: >-
      A Receipt is a document that acknowledges the payment received for goods
      or services purchased. It typically includes details such as the date of
      purchase, the items bought, the total amount paid, and any applicable
      taxes.
    context: https://w3id.org/retail-dw/v1rc2
    example:
      - label: A basic example of a Receipt
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "type": "Receipt",
            "description": "Your Utopia ShopCo Purchase on July 1st 2024",
            "image": "data:image/gif;base64,iVBORw0KGgoAAAANSU...ASUVORK5CYII="
            "confirmationNumber": "F7-3829948",
            "transactionID": "7839",
            "eventStartDateTime": "2025-03-24T18:55:20Z",
            "eventEndDateTime": "2025-03-24T18:57:12Z",
            "seller": {
              "type": "Store",
              "organizationID": "123",
              "description": "ShopCo",
              "taxID": "123457896",
              "storeLocationID": "234",
              "cashierID": "485",
              "sourcePOI": "lane-4",
              "tillID": "1",
              "telephone": "15555554958",
              "location": {
                "type": "PostalAddress",
                "streetAddress": "743 S. Broadway",
                "addressLocality": "Denver",
                "addressRegion": "CO",
                "postalCode": "80209"
              }
            },
            "transactionDetailGroup": [{
              "type": "PosJournalItemLine",
              "transactionLineSequenceNumber": 1,
              "description": "Electro Energy Drink",
              "itemCode": {
                "type": "ItemCode",
                "posCode": "1234567891234",
                "posCodeFormat": {
                  "type": "PosCodeFormat",
                  "format": "gtin",
                  "checkDigit": "present"
                }
              },
              "regularSellPrice": {
                "type": "Amount"
                "value": "3.99",
                "currency": "USD"
              },
              "discount": [{
                "type": "Discount"
                "discountReason": "storeCouponOffer"
                "discountAmount": {
                  "type": Amount,
                  "value": "-0.50",
                  "currency": "USD"
                },
              }],
              "itemTaxes": [{
                "type": "Tax"
                "taxCollectedAmount": {
                  "type": "Amount",
                  "value": "0.21",
                  "currency": "USD"
                }
              }],
              "actualSalesPrice": {
                "type": "Amount"
                "value": "3.49",
                "currency": "USD"
              }
            }, {
              "type": "PosJournalTenderInfoLine",
              "transactionLineSequenceNumber": 2,
              "description": "Payment (Cash)",
              "tender": {
                "type": "TenderID",
                "tenderCode": "cash"
              },
              "tenderAmount": {
                "type": "Amount"
                "value": "3.70",
                "currency": "USD"
              }
            }]
          }
  - id: RedemptionRule
    label: Redemption Rule
    comment: >-
      A class representing rules and conditions under which a redemption
      transaction can be executed in a reward or loyalty program. This includes
      parameters such as eligibility criteria, expiration dates, and specific
      terms that must be met for a reward to be redeemed.
    context: https://w3id.org/retail-dw/v1rc2
    example:
      - label: A basic example of the RedemptionRule class expressed as JSON-LD.
        json: |-
          {
            "@context": "https://w3id.org/retail-dw/v1rc2",
            "type": "RedemptionRule",
            "description": "Minimum limit 1 product. Maximum limit 1 per customer.",
            "gtin": "1234567890123",
            "maximumLimit": {
              "type": "Observation",
              "value": "1",
              "unitCode": "IE"
            },
            "minimumLimit": {
              "type": "Observation",
              "value": "1",
              "unitCode": "EA"
            }
          }
  - id: vc:RenderMethod
    label: Render Method
    comment: A mechanism for rendering data to a visual or wireless medium.
    context: https://w3id.org/retail-dw/v1rc2
  - id: RetailCredential
    label: Retail Benefit Credential
    comment: >-
      A credential that represents various benefits offered by retail stores,
      such as coupons, loyalty points, or gift cards.
    context: https://w3id.org/retail-dw/v1rc2
    example:
      - label: A basic example of the RetailCredential expressing a Coupon
        json: |-
          {
            "@context": [
              "https://www.w3.org/ns/credentials/v2",
              "https://w3id.org/retail-dw/v1rc2",
            ]
            "type": ["VerifiableCredential", "RetailCredential"],
            "issuer": {
              "id": "https://company.example/issuer-001",
              "name": "Fast Coffee Company"
            },
            "validFrom": "2023-12-05T00:00:00Z",
            "validUntil": "2024-12-05T00:00:00Z",
            "credentialSubject": {
              "@context": "https://w3id.org/retail-dw/v1rc2",
              "id": "https://coupon.example/12345",
              "type": "Coupon",
              "barcodeData": "0123456789123",
              "name": "$1 off a regular coffee.",
              "description": "Get $1 off any regular coffee. Limit one per customer per visit.",
              "discount": {
                "type": "Discount",
                "discountName": "$1 off a regular coffee.",
                "discountReason": "Celebrating 10 years in business!",
                "discountQuantity": {
                  "type": "QuantityUN",
                  "value": "1",
                  "uom": "EA"
                },
                "discountAmount": {
                  "type": "Amount",
                  "value": "-1.00",
                  "currency": "USD"
                }
              }
            },
            "renderMethod": [{
              "type": "TemplateRenderMethod",
              "renderSuite": "svg-mustache",
              "template": "data:image/svg+xml;base64,Qjei89...3jZpW"
            }, {
              "type": "TemplateRenderMethod",
              "renderSuite": "barcode",
              "name": "Scan at checkout",
              "template": "data:application/vcb;format=pdf417;base64,QGDG2QZkp...cY4BiwG8XJWnRO",
              "renderProperty": ["/credentialSubject/barcode"]
            }, {
              "type": "TemplateRenderMethod",
              "renderSuite": "barcode",
              "name": "Scan at checkout",
              "template": "data:image/png;base64,k38dQGDG2...cjf82Y4BiwG8XJ",
              "renderProperty": ["/credentialSubject/barcode"]
            }]
          }
      - label: A basic example of a RetailCredential expressing a LoyaltyCard
        json: |-
          {
            "@context": [
              "https://www.w3.org/ns/credentials/v2",
              "https://w3id.org/retail-dw/v1rc2"
            ],
            "type": ["VerifiableCredential", "RetailCredential"],
            "issuer": {
              "id": "https://shopco.example/",
              "name": "ShopCo"
            },
            "validFrom": "2025-03-01T00:00:00Z",
            "validUntil": "2026-03-01T00:00:00Z",
            "credentialSubject": {
              "type": "LoyaltyCard",
              "name": "ShopCo Points Card",
