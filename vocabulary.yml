  - id: sdo:Store
    label: Store
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:Tax
    label: Tax amount
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:TenderID
    label: Tender identifier
    comment: >-
      Tender description as defined by Conexxus, with tender code and sub code.
    context: https://w3id.org/retail-dw/v1rc2

property:
  - id: retail:account
    label: Account
    domain:
      - GiftCard
      - LoyaltyCard
      - MembershipCard
    comment: The account number associated with a particular card.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:actualSalesPrice
    label: Regular sales price
    range:
      - retail:Amount
    domain:
      - retail:LoyaltyItemLine
      - retail:PosJournalItemLine
      - retail:PosJournalMerchandiseCodeLine
      - retail:PosJournalFuelLine
      - retail:PosJournalFuelPrepayLine
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:addressLocality
    label: Address locality (town or city)
    domain:
      - sdo:PostalAddress
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:addressRegion
    label: Address region (state)
    domain:
      - sdo:PostalAddress
    context: https://w3id.org/retail-dw/v1rc2
  - id: authorizedAmount
    label: Authorized Amount
    domain: PaymentEntitlement
    range:
      - retail:Amount
    comment: >-
      The maximum monetary amount that may be captured against a payment
      entitlement. A capture may be for a lesser amount.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:barcodeData
    label: Bar Code Data
    domain:
      - Coupon
      - CouponBundle
      - GiftCard
      - LoyaltyCard
      - MembershipCard
      - Rebate
    context: https://w3id.org/retail-dw/v1rc2
  - id: bundleMatcher
    label: Coupon Bundle Matching Service
    domain: CouponBundle
    range: URL
    comment: >-
      This URL is used to communicate with the coupon bundle service to see if
      any item associated with a transaction matches the coupon bundle.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:cashierID
    label: Cashier Identifier
    domain:
      - sdo:Store
    context: https://w3id.org/retail-dw/v1rc2
  - id: capturedAmount
    label: Captured Amount
    domain: PaymentConfirmation
    range:
      - retail:Amount
    comment: >-
      The monetary amount that was captured to settle a payment. It may be less
      than the authorized amount of the corresponding payment entitlement.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:checkDigit
    label: Presence of check digit in point of sale code
    domain:
      - retail:PosCodeFormat
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:confirmationNumber
    label: Confirmation number
    domain:
      - Receipt
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:currency
    label: Monetary currency
    domain:
      - retail:Amount
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:description
    label: Description
    upper_value: retail:description
    domain:
      - Coupon
      - CouponBundle
      - GiftCard
      - LoyaltyCard
      - MembershipCard
      - GiftCard
    comment: >-
      A unique description for an instance of an item such as loyalty program,
      membership program, or gift card program that the card is associated with,
      used to differentiate between various items offered by an organization.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:discount
    label: Discount
    domain:
      - Coupon
      - retail:LoyaltyItemLine
      - retail:PosJournalItemLine
      - retail:PosJournalMerchandiseCodeLine
      - retail:PosJournalFuelLine
      - retail:PosJournalFuelPrepayLine
    comment: >-
      Represents the discount amount associated with a coupon, expressed as a
      monetary value.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:discountAmount
    label: Discount amount
    range:
      - retail:Amount
    domain:
      - retail:Discount
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:discountName
    label: Discount name
    domain:
      - retail:Discount
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:discountQuantity
    label: Discount quantity
    domain:
      - retail:Discount
    range:
      - retail:QuantityUN
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:discountReason
    label: Discount reason
    domain:
      - retail:Discount
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:eventEndDateTime
    label: Event end date and time
    domain:
      - Receipt
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:eventStartDateTime
    label: Event start date and time
    domain:
      - Receipt
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:format
    label: Point of sale code format
    domain:
      - retail:PosCodeFormat
    context: https://w3id.org/retail-dw/v1rc2
  - id: gtin
    label: GTIN
    domain: RedemptionRule
    comment: >-
      A property that specifies the GS1 Global Trade Identification Number
      (GTIN) associated with a product, which uniquely identifies a specific
      item in the marketplace.
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:image
    label: Image
    domain:
      - Coupon
      - CouponBundle
      - GiftCard
      - LoyaltyCard
      - MembershipCard
      - Rebate
    range: URL
    comment: >-
      A property that specifies the URL or identifier of an image associated
      with the respective entities, used for visual representation in digital or
      physical formats.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:itemCode
    label: Item code
    range:
      - retail:ItemCode
    domain:
      - retail:PosJournalItemLine
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:itemTaxes
    label: Item taxes
    range:
      - retail:Tax
    domain:
      - retail:LoyaltyItemLine
      - retail:PosJournalItemLine
      - retail:PosJournalMerchandiseCodeLine
      - retail:PosJournalFuelLine
      - retail:PosJournalFuelPrepayLine
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:location
    label: Location
    domain:
      - sdo:Store
    range: sdo:PostalAddress
    context: https://w3id.org/retail-dw/v1rc2
  - id: maximumAmount
    label: Maximum Amount
    domain: PaymentRequest
    range:
      - retail:Amount
    comment: >-
      The maximum monetary amount that may be collected to fulfill a payment
      request.
    context: https://w3id.org/retail-dw/v1rc2
  - id: maximumLimit
    label: Maximum Limit
    range: sdo:Observation
    domain: RedemptionRule
    comment: >-
      This property represents the maximum limit associated with a redemption
      rule, indicating the upper threshold related to the conditions of the
      redemption.
    context: https://w3id.org/retail-dw/v1rc2
  - id: minimumLimit
    label: Minimum quantity limit
    domain: RedemptionRule
    range: sdo:Observation
    comment: >-
      A property that defines the minimum quantity of items that must be
      purchased or redeemed in order to qualify for the RedemptionRule. This
      ensures that customers meet specific criteria before applying the
      redemption.
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:name
    label: Name
    domain:
      - Coupon
      - CouponBundle
      - GiftCard
      - LoyaltyCard
      - MembershipCard
      - Rebate
    comment: >-
      A short human-readable label that is used to identify a specific instance
      of an object. The name should be unique to the object. Examples include:
      "ShopCo Gift Card", "Big Gym Membership Card", and "$5 off YumChips".
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:organizationID
    label: Organization Identifier
    domain:
      - sdo:Store
    context: https://w3id.org/retail-dw/v1rc2
  - id: paymentDestination
    label: Payment Destination
    domain: PaymentRequest
    range: PaymentDestination
    comment: >-
      A destination that may receive payment in fulfillment of a payment
      request. A payment request may list more than one destination.
    context: https://w3id.org/retail-dw/v1rc2
  - id: paymentGateway
    label: Payment Gateway
    domain: 
      - PaymentInstrument
      - PaymentEntitlement
      - PaymentConfirmation
    range: PaymentGateway
    comment: >-
      The payment gateway at which a payment instrument may be used, against
      which a payment entitlement may be captured, or that performed a capture.
      The value may be a compact identifier or a PaymentGateway object; service
      information is discovered from the gateway's controlled identifier document
      rather than expressed in the credential.
    context: https://w3id.org/retail-dw/v1rc2
  - id: paymentNetwork
    label: Payment Network
    domain:
      - PaymentInstrument
      - PaymentDestination
      - PaymentEntitlement
      - PaymentConfirmation
    comment: >-
      An identifier used to determine whether a payment instrument is compatible
      with a payment request. A payment request must specify one or more payment
      networks, one of which must match the payment network of the payment
      instrument used to fulfill it.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:posCode
    label: Point of sale code
    domain:
      - retail:ItemCode
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:posCodeFormat
    label: Point of sale code format
    range:
      - retail:PosCodeFormat
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:postalCode
    label: Postal code (ZIP)
    domain:
      - sdo:PostalAddress
    context: https://w3id.org/retail-dw/v1rc2
  - id: programIdentifier
    label: Program Identifier
    domain:
      - LoyaltyCard
      - MembershipCard
      - GiftCard
    comment: >-
      A unique identifier for the loyalty program, membership program, or gift
      card program that the card is associated with, used to differentiate
      between various programs offered by an organization.
    context: https://w3id.org/retail-dw/v1rc2
  - id: redemptionRule
    label: Redemption Rule
    domain: Coupon
    range: RedemptionRule
    comment: >-
      A property that links a coupon to the specific redemption rules that apply
      to it, detailing the conditions and terms necessary for the coupon to be
      successfully redeemed.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:regularSellPrice
    label: Regular sales price
    range:
      - retail:Amount
    domain:
      - retail:LoyaltyItemLine
      - retail:PosJournalItemLine
      - retail:PosJournalMerchandiseCodeLine
      - retail:PosJournalFuelLine
      - retail:PosJournalFuelPrepayLine
    context: https://w3id.org/retail-dw/v1rc2
  - id: vc:renderMethod
    label: Render Method
    domain:
      - Coupon
      - CouponBundle
      - GiftCard
      - LoyaltyCard
      - MembershipCard
      - Rebate
    range: vc:RenderMethod
    comment: A mechanism used to render a visual or wireless expression of the benefit.
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:seller
    label: Seller
    domain:
      - Receipt
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:sourcePOI
    label: Source point of interaction
    domain:
      - sdo:Store
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:storeLocationID
    label: Store location identifier
    domain:
      - sdo:Store
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:streetAddress
    label: Street address
    domain:
      - sdo:PostalAddress
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:taxCollectedAmount
    label: Tax collected amount
    range:
      - retail:Amount
    domain:
      - retail:Tax
    comment: >-
      The monetary amount of tax collected for an associated transaction line
      or item.
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:taxID
    label: Tax Identifier
    domain:
      - sdo:Store
    context: https://w3id.org/retail-dw/v1rc2
  - id: sdo:telephone
    label: Telephone number
    domain:
      - sdo:Store
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:tender
    label: Tender information
    domain:
      - retail:PosJournalTenderInfoLine
    range:
      - retail:TenderID
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:tenderCode
    label: Tender code
    domain:
      - retail:TenderID
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:tenderAmount
    label: Tender amount
    range:
      - retail:Amount
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:tillID
    label: Till identifier
    domain:
      - sdo:Store
    context: https://w3id.org/retail-dw/v1rc2
  - id: token
    label: Token
    domain: PaymentToken
    range: sec:multibase
    comment: The payment tokenization value that is known to the token issuer.
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:transactionDetailGroup
    label: Transaction detail group
    domain:
      - Receipt
    range:
      - retail:PosJournalItemLine
      - retail:PosJournalLoyaltyLine
      - retail:PosJournalMerchandiseCodeLine
      - retail:PosJournalFuelLine
      - retail:PosJournalFuelPrepayLine
      - retail:PosJournalDiscountLine
      - retail:PosJournalTenderInfoLine
      - retail:PosJournalLinkedTransactionInfo
      - retail:PosJournalAgeVerificationLine
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:transactionID
    label: Transaction Identifier
    domain:
      - Receipt
      - PaymentRequest
      - PaymentEntitlement
      - PaymentConfirmation
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:transactionLineSequenceNumber
    label: Event end date and time
    domain:
      - retail:PosJournalItemLine
      - retail:PosJournalLoyaltyLine
      - retail:PosJournalMerchandiseCodeLine
      - retail:PosJournalFuelLine
      - retail:PosJournalFuelPrepayLine
      - retail:PosJournalDiscountLine
      - retail:PosJournalTenderInfoLine
      - retail:PosJournalLinkedTransactionInfo
      - retail:PosJournalAgeVerificationLine
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:uom
    label: Unit of Measure
    domain:
      - retail:QuantityUN
    context: https://w3id.org/retail-dw/v1rc2
  - id: retail:value
    label: A numerical value that is measured in units.
    domain:
      - retail:Amount
      - retail:QuantityUN
    context: https://w3id.org/retail-dw/v1rc2
datatype:
  - id: sec:multibase
    label: Datatype of Multibase
    comment: The Multibase datatype is used to express Multibase values.
    see_also:
      label: The Multibase specification
      url: https://www.w3.org/TR/cid-1.0/#multibase
    context: https://www.w3.org/ns/credentials/v2
